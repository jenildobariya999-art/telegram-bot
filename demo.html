<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Earn Wallet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#070716;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--ln:rgba(255,255,255,.11);
 --tx:#f6f5ff;--mut:#9d9bc4;--p1:#6d5dfc;--p2:#c471ed;--p3:#ff7eb3;--gold:#ffd36e;--ok:#35e3a4;--bad:#ff7a90;
 --grad:linear-gradient(120deg,#6d5dfc,#c471ed 55%,#ff7eb3);
 --font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 120px;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:300px;height:300px;background:#6d5dfc;top:-80px;right:-60px}
.aurora i:nth-child(2){width:260px;height:260px;background:#ff7eb3;top:240px;left:-110px;animation-delay:-5s;opacity:.35}
.aurora i:nth-child(3){width:240px;height:240px;background:#2bd9a8;bottom:-90px;right:-60px;animation-delay:-9s;opacity:.22}
@keyframes fl{to{transform:translate(30px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:46px;height:46px;border-radius:15px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:0 8px 22px #6d5dfc66;flex:none}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--mono);font-size:11px;color:var(--mut)}
.live{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:6px;border:1px solid #35e3a444;background:#35e3a412;border-radius:99px;padding:7px 11px;flex:none}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pu 1.6s infinite}
@keyframes pu{50%{opacity:.3}}
.glass{background:var(--glass);border:1px solid var(--ln);border-radius:24px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hero{position:relative;border-radius:28px;padding:22px;overflow:hidden;background:linear-gradient(135deg,#4a3df0 0%,#9a4fe0 55%,#ec6aa6 100%);box-shadow:0 18px 50px #6d5dfc55}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(240px 160px at 85% 0,#ffffff38,transparent 70%)}
.hero:after{content:"";position:absolute;right:-50px;bottom:-70px;width:190px;height:190px;border-radius:50%;border:30px solid #ffffff12}
.hero>*{position:relative;z-index:1}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.hero .k{color:#ffffffb8}
.amt{font-size:50px;font-weight:800;letter-spacing:-2.5px;margin:8px 0 18px;line-height:1}
.amt i{font-style:normal;font-size:28px;margin-right:4px;opacity:.85;vertical-align:top;position:relative;top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font-family:var(--font);font-weight:700;font-size:15px;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 10px 26px #6d5dfc55;position:relative;overflow:hidden}
.btn.w{background:#fff;color:#4a3df0;box-shadow:0 10px 26px #00000033}
.btn.ghost{background:var(--glass2);box-shadow:none;border:1px solid var(--ln);color:var(--tx)}
.btn.sm{display:inline-flex;width:auto;padding:12px 20px;font-size:13.5px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:active{transform:scale(.97)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st{background:var(--glass);border:1px solid var(--ln);border-radius:18px;padding:13px}
.st b{display:block;font-size:19px;margin-top:5px;font-weight:800}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 12px}
.sec span{font-family:var(--mono);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
/* bonus ticket */
.tk{position:relative;border-radius:24px;padding:1.5px;background:var(--grad)}
.tk.off{background:var(--ln)}
.tk-in{position:relative;display:flex;border-radius:23px;background:#0e0e24;overflow:hidden}
.tk-l{flex:1;padding:18px;min-width:0}
.tk-r{width:106px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-left:2px dashed var(--ln);background:linear-gradient(180deg,#ffd36e14,#ff7eb314);padding:14px 6px}
.tk-r .v{font-size:32px;font-weight:800;color:var(--gold);line-height:1}
.tk-r small{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--mut);margin-top:7px}
.tk.off .v{color:var(--mut)}
.tk-in:before,.tk-in:after{content:"";position:absolute;right:95px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--ln)}
.tk-in:before{top:-10px}.tk-in:after{bottom:-10px}
.tk h3{margin:0 0 6px;font-size:18px;font-weight:800}
.tk p{margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:99px;border:1px solid}
.chip.y{color:var(--ok);border-color:#35e3a444;background:#35e3a412}
.chip.n{color:var(--bad);border-color:#ff7a9055;background:#ff7a9012}
/* inputs */
label.f{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.in{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--ln);border-radius:15px;padding:15px 16px;color:var(--tx);font-family:var(--mono);font-size:15px;outline:none;transition:.2s}
.in:focus{border-color:var(--p2);box-shadow:0 0 0 3px #c471ed26}
.sum{margin:16px 0;border:1px dashed var(--ln);border-radius:16px;padding:6px 14px;font-family:var(--mono);font-size:13px}
.sum div{display:flex;justify-content:space-between;padding:7px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}.gold{color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0;padding-bottom:0}.li:first-child{padding-top:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--glass2)}
.ic.in{color:var(--ok)}.ic.out{color:var(--bad)}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{font-size:12px;color:var(--mut)}
.pill{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:99px;background:#35e3a418;color:var(--ok);white-space:nowrap}
.pill.q{background:#ffd36e18;color:var(--gold)}
.link{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid var(--ln);border-radius:16px;padding:7px 7px 7px 15px;font-family:var(--mono);font-size:12.5px}
.link span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:492px;margin:0 auto;z-index:30;display:flex;gap:4px;background:rgba(16,14,40,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:24px;padding:6px;box-shadow:0 14px 40px #00000066}
.dock button{flex:1;background:none;border:0;color:var(--mut);font-family:var(--font);font-weight:700;font-size:10.5px;letter-spacing:.6px;padding:10px 0 8px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:.2s}
.dock svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{color:#fff;background:var(--grad);box-shadow:0 6px 18px #6d5dfc66}
.hide{display:none!important}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-150px);background:rgba(20,18,48,.95);border:1px solid var(--p2);padding:12px 20px;border-radius:16px;z-index:99;font-weight:700;font-size:14px;transition:.35s cubic-bezier(.2,.9,.3,1.2);max-width:92%;text-align:center;backdrop-filter:blur(10px)}
.toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(5,5,16,.94);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.ch{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-top:10px}
.ch b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch a{background:var(--grad);color:#fff;font-weight:800;font-size:12px;text-decoration:none;border-radius:99px;padding:8px 16px}
.ch .j{color:var(--ok);font-size:12px;font-weight:700}
.sw{position:relative;width:54px;height:30px;border-radius:99px;background:var(--glass2);border:1px solid var(--ln);cursor:pointer;flex:none;transition:.25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.25s}
.sw.on{background:var(--grad);border-color:transparent}
.sw.on:after{left:27px;background:#fff}
.grp{margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:12px;color:var(--mut);line-height:1.6;margin-top:8px}
.help code{font-family:var(--mono);color:var(--gold)}
.foot{text-align:center;font-family:var(--mono);font-size:10px;color:#6a6891;margin-top:26px}
.skel{height:150px;border-radius:28px;background:linear-gradient(100deg,var(--glass) 30%,var(--glass2) 50%,var(--glass) 70%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.boom{position:fixed;left:50%;top:40%;font-size:34px;z-index:98;pointer-events:none;animation:bm 1.1s ease-out forwards}
@keyframes bm{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.em{display:inline-block;vertical-align:middle}
.dock button{position:relative}
.bdg{position:absolute;top:2px;right:16%;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-style:normal;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 10px #ff7a90aa}
.pill.r{background:#ff7a9018;color:var(--bad)}
.li[data-tx]{cursor:pointer;transition:.15s}
.li[data-tx]:active{opacity:.6}
.ov.pop{align-items:flex-end;background:rgba(5,5,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;padding:0}
.sheet{width:100%;max-width:520px;margin:0 auto;background:#0f0e26;border:1px solid var(--ln);border-bottom:0;border-radius:30px 30px 0 0;padding:24px 18px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .3s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -20px 60px #6d5dfc33}
@keyframes up{from{transform:translateY(80px);opacity:0}}
.pc{text-align:center;margin-bottom:8px}
.pc h3{margin:8px 0 4px;font-size:20px;font-weight:800}
.pc .big{font-size:36px;font-weight:800;margin:4px 0 10px;font-family:var(--mono)}
.sheet .btn{margin-top:6px}
.sheet .two{margin-top:12px}
.sheet .sum code{font-family:var(--mono);color:var(--gold)}
.rq{border:1px solid var(--ln);border-radius:20px;padding:14px;margin-top:12px;background:var(--glass)}
.rq .m b{display:block;font-size:24px;font-weight:800}
.rq .m small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.btn.sm2{padding:13px;font-size:14px}
.btn.ap{background:linear-gradient(120deg,#12b981,#35e3a4);color:#03281c;box-shadow:0 8px 22px #12b98144}
.btn.rj{background:linear-gradient(120deg,#ff4d6d,#ff8aa0);box-shadow:0 8px 22px #ff4d6d44}

.splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 38%,#241866 0,#0c0a2b 45%,#070716 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .55s ease,visibility .55s,transform .55s}
.splash.out{opacity:0;visibility:hidden;transform:scale(1.06)}
.sp-ring{width:138px;height:138px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,#6d5dfc,#c471ed,#ff7eb3,#ffd36e,#35e3a4,#6d5dfc);animation:spin 1.7s linear infinite;box-shadow:0 0 60px #6d5dfc88,0 0 120px #ff7eb344}
.sp-in{width:100%;height:100%;border-radius:50%;background:#0b0a22;display:grid;place-items:center;animation:spin 1.7s linear infinite reverse}
.sp-in img{animation:bob 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:scale(1.12)}}
.sp-t{font-size:26px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-s{font-family:var(--mono);font-size:11.5px;letter-spacing:2.4px;color:var(--mut);text-transform:uppercase}
.sp-s:after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
.sp-bar{width:190px;height:5px;border-radius:9px;background:#ffffff14;overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:var(--grad);animation:bar 1.3s ease-in-out infinite}
@keyframes bar{0%{margin-left:-40%}100%{margin-left:100%}}
.sp-f{position:absolute;opacity:.85;animation:fly 5s ease-in-out infinite}
.sp-f:nth-of-type(1){left:14%;top:22%}
.sp-f:nth-of-type(2){right:13%;top:30%;animation-delay:-1.5s}
.sp-f:nth-of-type(3){left:20%;bottom:20%;animation-delay:-3s}
.sp-f:nth-of-type(4){right:18%;bottom:24%;animation-delay:-2.2s}
@keyframes fly{50%{transform:translateY(-22px) rotate(12deg)}}
.wrap>*{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
.wrap>*:nth-child(2){animation-delay:.05s}.wrap>*:nth-child(3){animation-delay:.1s}.wrap>*:nth-child(4){animation-delay:.15s}.wrap>*:nth-child(5){animation-delay:.2s}.wrap>*:nth-child(6){animation-delay:.25s}.wrap>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.hero .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff2e 50%,transparent 65%);transform:translateX(-120%);animation:sh 4.5s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes sh{55%,100%{transform:translateX(120%)}}
.amt{background:linear-gradient(180deg,#fff,#ffe3f1);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 18px #ffffff40)}
.amt i{color:#fff;-webkit-text-fill-color:#fffc}
.sec span{display:flex;align-items:center;gap:8px}
.sec span:first-child:before{content:"";width:4px;height:14px;border-radius:4px;background:var(--grad)}
.glass{box-shadow:0 10px 34px #00000040,inset 0 1px 0 #ffffff12}
.st{transition:.2s}.st:active{transform:scale(.96)}
.st:nth-child(1) .k{color:#8fb4ff}.st:nth-child(2) .k{color:#7df0c4}.st:nth-child(3) .k{color:#ffd36e}
.btn:not(.ghost):not(:disabled):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);animation:bs 3.2s ease-in-out infinite}
@keyframes bs{60%,100%{left:130%}}
.dock{box-shadow:0 14px 40px #00000066,0 0 0 1px #ffffff10,0 0 40px #6d5dfc22}
.dock button.on{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 26px #c471edaa}}
.li{border-radius:12px;transition:.15s}
.pill{box-shadow:inset 0 0 0 1px #ffffff10}
.live:before{animation:pu 1.2s infinite}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="splash" id="splash"><img class="sp-f" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4b0/512.gif" width="38" height="38" alt="" onerror="this.remove()"><img class="sp-f" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f48e/512.gif" width="38" height="38" alt="" onerror="this.remove()"><img class="sp-f" src="https://fonts.gstatic.com/s/e/notoemoji/latest/2728/512.gif" width="38" height="38" alt="" onerror="this.remove()"><img class="sp-f" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4b8/512.gif" width="38" height="38" alt="" onerror="this.remove()"><div class="sp-ring"><div class="sp-in"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.gif" width="64" height="64" alt="" onerror="this.outerHTML='<span style=font-size:56px>&#128640;</span>'"></div></div><div class="sp-t" id="spT">Earn Wallet</div><div class="sp-bar"><i></i></div><div class="sp-s">Loading your wallet</div></div>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"><div class="skel"></div><div class="skel" style="height:90px"></div><div class="skel" style="height:120px"></div></div>

<div class="ov hide" id="gate"><div class="glass" style="width:100%;max-width:440px">
  <div class="k">Last step</div>
  <h2 style="margin:6px 0 4px;font-size:25px;font-weight:800">Join our channels</h2>
  <div class="mut" style="font-size:14px">Join every channel below to unlock your wallet.</div>
  <div id="gateList"></div>
  <button class="btn" id="gateBtn" style="margin-top:18px">I joined — check</button>
</div></div>

<div class="ov pop hide" id="pop"><div class="sheet" id="popBox"></div></div>
<div class="dock hide" id="dock"></div>

<script>
window.addEventListener('error', e => { const a = document.getElementById('app'); if (a && a.querySelector('.skel')) a.innerHTML = '<div class="glass" style="color:#ff7a90"><b>App error:</b> ' + String(e.message).replace(/</g, '&lt;') + '</div>'; });
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#070716'); tg.setBackgroundColor('#070716'); } catch (e) {} }
const q = new URLSearchParams(location.search);
const API = q.get('api');
const UID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && String(tg.initDataUnsafe.user.id)) || q.get('u') || '';
const BUILD = 'app-v3';
let S = null, A = null, tab = 'home';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => { n = Math.round((Number(n) || 0) * 100) / 100; return Number.isInteger(n) ? String(n) : n.toFixed(2); };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
function boom() { for (let i = 0; i < 14; i++) { const e = document.createElement('div'); e.className = 'boom'; const z = [['1f389','🎉'],['2728','✨'],['1f4b0','💰'],['2b50','⭐']][i % 4]; e.innerHTML = EM(z[0], z[1], 34); e.style.setProperty('--x', (Math.random() * 300 - 150) + 'px'); e.style.setProperty('--y', (Math.random() * -260 - 40) + 'px'); e.style.setProperty('--r', (Math.random() * 360) + 'deg'); document.body.appendChild(e); setTimeout(() => e.remove(), 1200); } }

async function call(a, extra) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ a, uid: UID }, extra || {})), signal: ctl.signal });
    const j = await r.json();
    // TBC wraps the bot's answer as {"ok":true,"result":{...}}: always hand back the inner object

    '<div class="sec"><span>Withdraw limits</span></div><div class="glass"><div class="two"><div><label class="f" style="margin-top:0">Min ₹</label><input class="in" id="aMin" type="number" value="' + rs(A.wmin) + '"></div><div><label class="f" style="margin-top:0">Max ₹</label><input class="in" id="aMax" type="number" value="' + rs(A.wmax) + '"></div></div>' +
    '<label class="f">Withdrawals per day (per user)</label><input class="in" id="aDay" type="number" value="' + A.wdPerDay + '"><button class="btn" id="saveWd" style="margin-top:14px">Save limits</button></div>' +
    '<div class="sec"><span>Reset user (testing)</span></div><div class="glass"><label class="f" style="margin-top:0">Telegram user id</label><input class="in" id="rUid" type="number" inputmode="numeric" placeholder="123456789"><div class="help">Clears the “same device” mark and the bonus-claimed mark so that user can claim the welcome bonus again.</div><button class="btn ghost" id="saveRs" style="margin-top:12px">Reset this user</button></div>' +
    '<div class="sec"><span>UPI gateway API</span></div><div class="glass"><label class="f" style="margin-top:0">API link (GET)</label><input class="in" id="gUrl" placeholder="https://gateway.com/api?token={token}&upi={upi}&amount={amount}" value="' + esc(A.gwUrl) + '" autocapitalize="off">' +
    '<div class="two"><div><label class="f">Token / key</label><input class="in" id="gKey" placeholder="' + (A.gwKeySet ? esc(A.gwKeyMask) + ' saved' : 'paste key') + '" autocapitalize="off"></div><div><label class="f">Merchant id</label><input class="in" id="gMid" value="' + esc(A.gwMid) + '" placeholder="optional"></div></div>' +
    '<div class="help">Placeholders: <code>{upi}</code> <code>{amount}</code> <code>{token}</code> <code>{mid}</code>. Success = JSON <code>"status":"success"</code>, otherwise the user is refunded. Empty link = manual payout via your payment channel. Empty key box keeps the saved key.</div>' +
    '<button class="btn" id="saveGw" style="margin-top:14px">Save gateway</button></div>' + foot();
}
async function setCfg(f, v) { const r = await call('adm_cfg_set', { f, v }); if (!r.ok) throw new Error(r.error || 'Failed'); }
function wireAdmin() {
  const flip = (id, f, key) => { const e = $(id); if (!e) return; e.onclick = async () => { const on = !e.classList.contains('on'); try { await setCfg(f, on ? 'ON' : 'OFF'); A[key] = on; e.classList.toggle('on', on); toast((f === 'BotMode' ? 'Bot ' : 'Withdraw ') + (on ? 'ON' : 'OFF')); } catch (x) { toast(x.message); } }; };
  flip('swBot', 'BotMode', 'botOn'); flip('swWd', 'WithdrawMode', 'wdOn');
  const run = (id, fn) => { const b = $(id); if (!b) return; b.onclick = async () => { b.disabled = true; try { await fn(); toast('Saved ✓'); await load(true); } catch (x) { toast(x.message); } b.disabled = false; }; };
  run('saveBR', async () => { let r = await call('adm_set', { f: 'StartBonus', v: $('aBonus').value }); if (!r.ok) throw new Error(r.error); r = await call('adm_set', { f: 'PerRefer', v: $('aRef').value }); if (!r.ok) throw new Error(r.error); });
  run('saveWd', async () => { const r = await call('adm_wd_set', { wmin: $('aMin').value, wmax: $('aMax').value }); if (!r.ok) throw new Error(r.error); await setCfg('WdPerDay', $('aDay').value); });
  run('saveRs', async () => { const r = await call('adm_user_reset', { target: $('rUid').value.trim() }); if (!r.ok) throw new Error(r.error || 'Failed'); });
  run('saveGw', async () => { await setCfg('GwUrl', $('gUrl').value.trim()); await setCfg('GwMid', $('gMid').value.trim()); if ($('gKey').value.trim()) await setCfg('GwKey', $('gKey').value.trim()); });
}

const ICONS = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  invite: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M17 5.5a3 3 0 010 5.8M18.5 14.3c2 .7 3.5 2.4 3.5 5.7"/></svg>',
  wd: '<svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>',
  admin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};
function render() {
  const app = $('app');
  const admin_ok = S.admin;
  if (tab === 'admin' && !admin_ok) tab = 'home';
  app.innerHTML = tab === 'home' ? home() : tab === 'invite' ? invite() : tab === 'wd' ? wd() : admin();
  paintDock();
  app.querySelectorAll('[data-go]').forEach(e => e.onclick = () => { tab = e.dataset.go; render(); });
  wireTx(app);
  window.scrollTo(0, 0);
  const cb = $('claimBtn');
  if (cb) cb.onclick = async () => {
    cb.disabled = true;
    try {
      const r = await call('claim_bonus');
      if (r.ok) { boom(); toast('₹' + rs(r.amount) + ' added to wallet'); await load(true); }
      else if (r.gate) { showGate(r.gate); toast(r.error); }
      else { toast(r.error || 'Failed'); cb.disabled = false; }
    } catch (e) { toast('Network error'); cb.disabled = false; }
  };
  if ($('copyBtn')) {
    $('copyBtn').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(S.link) : Promise.reject()).then(() => toast('Link copied ✓')).catch(() => toast(S.link)); };
    $('shareBtn').onclick = () => { const u = 'https://t.me/share/url?url=' + encodeURIComponent(S.link) + '&text=' + encodeURIComponent('Join and earn money!'); if (tg) tg.openTelegramLink(u); else window.open(u, '_blank'); };
  }
  if ($('wdBtn')) {
    const sync = () => { const v = rs($('amt').value); $('s1').textContent = '₹' + v; $('s2').textContent = '₹' + v; };
    $('amt').oninput = sync;
    $('wdBtn').onclick = () => {
      const upi = $('upi').value.trim().toLowerCase(), amount = Number($('amt').value), w = S.wd || {};
      if (!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi)) return toast('Enter a valid UPI ID');
      if (amount < w.min || amount > w.max) return toast('Amount must be ₹' + rs(w.min) + ' - ₹' + rs(w.max));
      if (amount > S.balance) return toast('Amount exceeds your balance');
      if (w.used) return toast('Daily cashout limit reached');
      confirmWd(upi, amount);
    };
  }
  if (tab === 'admin') { wireAdmin(); paintQ(); }
}
function hideSplash() { const s = $('splash'); if (!s || s.dataset.d) return; s.dataset.d = 1; s.classList.add('out'); setTimeout(() => s.remove(), 700); }
setTimeout(hideSplash, 12000);
const _t0 = Date.now();
load().catch(e => { $('app').innerHTML = '<div class="glass bad"><b>' + esc(e.message) + '</b></div>'; }).finally(() => setTimeout(hideSplash, Math.max(0, 900 - (Date.now() - _t0))));
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) refresh(); });
</script>
